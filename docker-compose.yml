version: '3'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - 3333:3333
    environment:
      - DATABASE_URL=
      - SQS_CRIAR_PAGAMENTO_QUEUE=
      - SQS_CRIAR_PEDIDO_PRODUCAO_QUEUE=
      - AWS_REGION=
      - AWS_ACCESS_KEY_ID_B64=
      - AWS_SECRET_ACCESS_KEY_B64=
      - URL_CLIENTE_MS=